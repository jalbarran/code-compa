name: Build & Package Code Compa

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-go:
    name: Build Go Sidecar Multiplatform
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build Multiplatform Binaries
      run: |
        cd packages/bridge-go
        mkdir -p bin
        GOOS=linux GOARCH=amd64 go build -o bin/bridge-linux-amd64 ./cmd/bridge
        GOOS=darwin GOARCH=arm64 go build -o bin/bridge-darwin-arm64 ./cmd/bridge
        GOOS=windows GOARCH=amd64 go build -o bin/bridge-windows-amd64.exe ./cmd/bridge

    - name: Upload Go Sidecar Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: go-sidecar
        path: packages/bridge-go/bin/
        if-no-files-found: error

  build-web:
    name: Build Web App (Expo)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies (proto-ts & expo)
      run: |
        cd packages/proto-ts
        npm ci
        cd ../../apps/mobile-expo
        npm ci

    # Cambiado: Ejecuta tu comando específico con la bandera --clear
    - name: Build Web App
      run: |
        cd apps/mobile-expo
        npx expo export --platform web --clear

    - name: Upload Web App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-app-dist
        path: apps/mobile-expo/dist/
        if-no-files-found: error

  package-extension:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    needs: [build-go, build-web]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Download Go Sidecar
      uses: actions/download-artifact@v4
      with:
        name: go-sidecar
        path: plugins/vscode-extension/bin/

    # Cambiado: Descarga la Web App directamente en la carpeta 'web' de la extensión
    - name: Download Web App
      uses: actions/download-artifact@v4
      with:
        name: web-app-dist
        path: plugins/vscode-extension/web/

    - name: Build VS Code Extension
      run: |
        cd packages/proto-ts
        npm pack
        
        cd ../../plugins/vscode-extension
        node -e "const p = require('./package.json'); p.dependencies['code-compa-proto-ts'] = 'file:../../packages/proto-ts/code-compa-proto-ts-0.0.1.tgz'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2))"
        
        rm -f ../../package-lock.json
        rm -f package-lock.json
        
        npm install
        npm run compile

    - name: Package VS Code Extension (VSIX)
      run: |
        cd plugins/vscode-extension
        cp ../../LICENSE ./
        
        # Asegurar permisos de ejecución para los binarios de Go descargados
        chmod +x bin/bridge-linux-amd64 || true
        chmod +x bin/bridge-darwin-arm64 || true
        
        npx @vscode/vsce package --no-dependencies --allow-missing-repository

    - name: Upload VSIX Artifact
      uses: actions/upload-artifact@v4
      with:
        name: code-compa-vscode-extension
        path: plugins/vscode-extension/*.vsix
        if-no-files-found: error