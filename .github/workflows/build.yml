name: Build & Package Code Compa

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-go:
    name: Build Go Sidecar
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build Go Sidecar
      run: make build-bridge

    - name: Upload Go Sidecar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: go-sidecar
        path: packages/bridge-go/bridge
        if-no-files-found: error

  build-web:
    name: Build Web App (Expo)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies (proto-ts & expo)
      run: |
        cd packages/proto-ts
        npm ci
        cd ../../apps/mobile-expo
        npm ci

    - name: Build Web App
      run: |
        cd apps/mobile-expo
        npx expo export --platform web

    - name: Upload Web App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-app-dist
        path: apps/mobile-expo/dist/
        if-no-files-found: error

  package-extension:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    needs: [build-go, build-web]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Download Go Sidecar
      uses: actions/download-artifact@v4
      with:
        name: go-sidecar
        path: plugins/vscode-extension/bin/

    - name: Download Web App
      uses: actions/download-artifact@v4
      with:
        name: web-app-dist
        path: plugins/vscode-extension/web/

    - name: Build VS Code Extension
      run: |
        cd plugins/vscode-extension
        npm ci
        # Replace the local workspace symlink with a physical copy to prevent vsce duplicate packaging issues
        rm -rf node_modules/code-compa-proto-ts
        mkdir -p node_modules/code-compa-proto-ts
        cp -R ../../packages/proto-ts/* node_modules/code-compa-proto-ts/
        rm -rf node_modules/code-compa-proto-ts/node_modules
        # Strip dependencies from nested package.json so npm list doesn't report ELSPROBLEMS during vsce packaging
        node -e "const p = require('./node_modules/code-compa-proto-ts/package.json'); delete p.dependencies; require('fs').writeFileSync('./node_modules/code-compa-proto-ts/package.json', JSON.stringify(p, null, 2))"
        npm run compile

    - name: Package VS Code Extension (VSIX)
      run: |
        cd plugins/vscode-extension
        npx @vscode/vsce package --allow-missing-repository

    - name: Upload VSIX Artifact
      uses: actions/upload-artifact@v4
      with:
        name: code-compa-vscode-extension
        path: plugins/vscode-extension/*.vsix
        if-no-files-found: error
