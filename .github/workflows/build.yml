name: Build & Package Code Compa

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install dependencies and compile Proto stubs
      run: |
        npm install -g @bufbuild/buf
        # If buf is not in path or needs manual building, compile via make
        # We can bypass buf generate if stubs are already committed,
        # but let's run make all/compile if needed.

    - name: Build Go Sidecar
      run: |
        make build-bridge

    - name: Build Web App (Expo)
      run: |
        cd apps/mobile-expo
        npm ci
        npx expo export --platform web

    - name: Bundle Web Assets into VS Code extension
      run: |
        mkdir -p plugins/vscode-extension/web
        cp -r apps/mobile-expo/dist/* plugins/vscode-extension/web/

    - name: Build VS Code Extension
      run: |
        cd plugins/vscode-extension
        npm ci
        npm run compile

    - name: Package VS Code Extension (VSIX)
      run: |
        cd plugins/vscode-extension
        npx @vscode/vsce package --no-dependencies

    - name: Upload VSIX Artifact
      uses: actions/upload-artifact@v4
      with:
        name: code-compa-vscode-extension
        path: plugins/vscode-extension/*.vsix
        if-no-files-found: error
