<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <rect x="0" y="0" width="24" height="24" fill="none"/>
  <!-- Phone Outer Frame -->
  <rect x="6" y="2" width="12" height="20" rx="2" fill="none" stroke="#2563EB" stroke-width="2"/>
  <!-- Screen top notch / speaker -->
  <line x1="10" y1="4" x2="14" y2="4" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Connected Signal Nodes -->
  <circle cx="12" cy="12" r="3" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="12" cy="12" r="0.75" fill="#10B981"/>
</svg>
